api_version: 1
php_version: 8.2

# Pantheon supports MariaDB 10.4 and 10.6.
# https://pantheon.io/docs/pantheon-yml#specify-a-version-of-mariadb
database:
  version: 10.6

enforce_https: transitional

# Multisite search-replace is not supported on Integrated Composer / external
# repository sites, so it is disabled. Domains are converted manually with
# `terminus remote:wp <site>.<env> -- search-replace ... --network`.
# https://docs.pantheon.io/guides/multisite/search-replace#known-issues
search_replace: false

protected_web_paths:
  - /private/
  - /wp-content/uploads/private/
  - /xmlrpc.php
